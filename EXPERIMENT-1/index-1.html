 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div>
    <h2>STUDENT EVENT REGISTRATION </h2>

    <form action="registration-2.html">

        <label>Name:</label>
        <input
            type="text"
            pattern="[A-Za-z ]{2,50}"
            placeholder="Enter your name"
            required>

        <br><br>

        <label>Phone No:</label>
        <input
            type="text"
            inputmode="numeric"
            pattern="[0-9]{10}"
            maxlength="10"
            placeholder="10 digits only"
            required>

        <br><br>

        <label>Branch:</label>

        <select required>
            <option value="">Select Branch</option>
            <option>CSE</option>
            <option>AIML</option>
            <option>AIDS</option>
        </select>

        <br><br>

        <label>Hall Ticket No:</label>

        <input
            type="text"
            pattern="[0-9]{2}[Dd][0-9]{2}[A-Za-z][0-9]{2}[GHJKMNPQghjkmnpq][0-9]"
            maxlength="10"
            placeholder="Example: 24D01A05.."
            title="Format: 24D01A05G0 to 24D01A05Q9 (Allowed letters: G, H, J, K, M, N, P, Q)"
            required>

        <br><br>

        <button type="reset">Reset</button>
        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
